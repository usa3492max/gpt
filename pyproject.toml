[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redloop"
version = "0.1.0"
description = "Autonomous, LLM-driven penetration-testing agent with a live terminal feed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "redloop contributors" }]
keywords = ["security", "pentest", "ctf", "llm", "agent", "offensive"]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
docs = ["markdown>=3.5"]

[project.scripts]
redloop = "redloop.cli:main"

[tool.setuptools.packages.find]
include = ["redloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM105"]
